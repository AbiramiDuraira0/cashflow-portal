<aside 
  class="side-menu" 
  [class.collapsed]="isMenuCollapsed()"
  (mouseenter)="onMenuMouseEnter()"
  (mouseleave)="onMenuMouseLeave()">
  
  <div class="menu-header">
    <div class="menu-toggle" (click)="toggleMenu()">
      <!-- SVG Icon for Menu -->
      <svg 
        class="menu-icon" 
        [class.hovered]="isMenuHovered()"
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </div>
    <div class="menu-title" *ngIf="!isMenuCollapsed()">
      <h1 class="menu-title-text">Cashflow Portal</h1>
    </div>
  </div>

  <nav class="menu-content">
    <ul class="menu-list">
      <li class="menu-item">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-link" (click)="onMenuItemClick()" data-tooltip="Dashboard" title="">
          <span class="menu-icon">🏠</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Dashboard</span>
        </a>
      </li>
      <li class="menu-item">
        <a routerLink="/income" routerLinkActive="active" class="menu-link" (click)="onMenuItemClick()" data-tooltip="Income" title="">
          <span class="menu-icon">💰</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Income</span>
        </a>
      </li>
      <li class="menu-item">
        <a routerLink="/expense" routerLinkActive="active" class="menu-link" (click)="onMenuItemClick()" data-tooltip="Expense" title="">
          <span class="menu-icon">💸</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Expense</span>
        </a>
      </li>
      <li class="menu-item">
        <a routerLink="/category" routerLinkActive="active" class="menu-link" (click)="onMenuItemClick()" data-tooltip="Category" title="">
          <span class="menu-icon">📁</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Category</span>
        </a>
      </li>
      <li class="menu-item">
        <a routerLink="/investment" routerLinkActive="active" class="menu-link" (click)="onMenuItemClick()" data-tooltip="Investment" title="">
          <span class="menu-icon">📈</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Investment</span>
        </a>
      </li>
      <li class="menu-item">
        <a routerLink="/debts" routerLinkActive="active" class="menu-link" (click)="onMenuItemClick()" data-tooltip="Debts" title="">
          <span class="menu-icon">🏦</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Debts</span>
        </a>
      </li>
      <li class="menu-item">
        <a routerLink="/report" routerLinkActive="active" class="menu-link" (click)="onMenuItemClick()" data-tooltip="Report" title="">
          <span class="menu-icon">📊</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Report</span>
        </a>
      </li>
      <li class="menu-item menu-divider"></li>
      <li class="menu-item">
        <a class="menu-link logout-link" (click)="logout()" data-tooltip="Logout" title="">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logout-icon">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Logout</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
