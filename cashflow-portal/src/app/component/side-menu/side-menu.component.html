<aside 
  class="side-menu" 
  [class.collapsed]="isMenuCollapsed()"
  (mouseenter)="onMenuMouseEnter()"
  (mouseleave)="onMenuMouseLeave()">
  
  <div class="menu-header">
    <!-- When collapsed: show toggle icon on left -->
    <div class="menu-toggle" 
         *ngIf="isMenuCollapsed()"
         (click)="toggleMenu()"
         [attr.data-tooltip]="'Expand'">
      <!-- SVG Icon for Menu -->
      <svg 
        class="menu-icon" 
        [class.hovered]="isMenuHovered()"
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </div>
    
    <!-- When expanded: show title first, then toggle icon -->
    <div class="menu-title" *ngIf="!isMenuCollapsed()">
      <h1 class="menu-title-text">Cashflow Portal</h1>
    </div>
    <div class="menu-toggle" 
         *ngIf="!isMenuCollapsed()"
         (click)="toggleMenu()">
      <!-- SVG Icon for Menu -->
      <svg 
        class="menu-icon" 
        [class.hovered]="isMenuHovered()"
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </div>
  </div>

  <nav class="menu-content">
    <ul class="menu-list">
      <li class="menu-item">
        <a [routerLink]="['/dashboard']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" 
           class="menu-link" 
           [attr.data-tooltip]="isMenuCollapsed() ? 'Dashboard' : null"
           (click)="onMenuItemClick()" 
           (mousedown)="$event.preventDefault()">
          <span class="menu-icon-emoji">🏠</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Dashboard</span>
        </a>
      </li>
      <li class="menu-item">
        <a [routerLink]="['/income']" routerLinkActive="active" 
           class="menu-link" 
           [attr.data-tooltip]="isMenuCollapsed() ? 'Income' : null"
           (click)="onMenuItemClick()" 
           (mousedown)="$event.preventDefault()">
          <span class="menu-icon-emoji">💰</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Income</span>
        </a>
      </li>
      <li class="menu-item">
        <a [routerLink]="['/expense']" routerLinkActive="active" 
           class="menu-link" 
           [attr.data-tooltip]="isMenuCollapsed() ? 'Expense' : null"
           (click)="onMenuItemClick()" 
           (mousedown)="$event.preventDefault()">
          <span class="menu-icon-emoji">💸</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Expense</span>
        </a>
      </li>
      <li class="menu-item">
        <a [routerLink]="['/category']" routerLinkActive="active" 
           class="menu-link" 
           [attr.data-tooltip]="isMenuCollapsed() ? 'Category' : null"
           (click)="onMenuItemClick()" 
           (mousedown)="$event.preventDefault()">
          <span class="menu-icon-emoji">📁</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Category</span>
        </a>
      </li>
      <li class="menu-item">
        <a [routerLink]="['/investment']" routerLinkActive="active" 
           class="menu-link" 
           [attr.data-tooltip]="isMenuCollapsed() ? 'Investment' : null"
           (click)="onMenuItemClick()" 
           (mousedown)="$event.preventDefault()">
          <span class="menu-icon-emoji">📈</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Investment</span>
        </a>
      </li>
      <li class="menu-item">
        <a [routerLink]="['/debts']" routerLinkActive="active" 
           class="menu-link" 
           [attr.data-tooltip]="isMenuCollapsed() ? 'Debts' : null"
           (click)="onMenuItemClick()" 
           (mousedown)="$event.preventDefault()">
          <span class="menu-icon-emoji">🏦</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Debts</span>
        </a>
      </li>
      <li class="menu-item">
        <a [routerLink]="['/report']" routerLinkActive="active" 
           class="menu-link" 
           [attr.data-tooltip]="isMenuCollapsed() ? 'Report' : null"
           (click)="onMenuItemClick()" 
           (mousedown)="$event.preventDefault()">
          <span class="menu-icon-emoji">📊</span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Report</span>
        </a>
      </li>
      <li class="menu-item menu-divider"></li>
      <li class="menu-item">
        <a class="menu-link logout-link" 
           [attr.data-tooltip]="isMenuCollapsed() ? 'Logout' : null"
           (click)="logout()" 
           (mousedown)="$event.preventDefault()">
          <span class="menu-icon-emoji">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logout-icon">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </span>
          <span class="menu-text" *ngIf="!isMenuCollapsed()">Logout</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
