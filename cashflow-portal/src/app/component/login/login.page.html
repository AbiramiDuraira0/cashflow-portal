<div class="login-container">
  <!-- Left side - Image without blur -->
  <div class="image-section"></div>
  
  <!-- Right side - Login form -->
  <div class="form-section">
    <div class="login-card" [class.shake]="isShaking">
      <!-- Logo/Header section -->
      <div class="login-header">
        <div class="logo-circle">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </div>
        <h1 class="login-title">Cashflow Portal</h1>
        <p class="login-subtitle">Enter your passcode to continue</p>
      </div>

      <!-- Form section -->
      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="passcode" class="form-label">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="label-icon">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Passcode
          </label>
          <input 
            type="password" 
            id="passcode" 
            name="passcode"
            [(ngModel)]="passcode"
            (ngModelChange)="onPasscodeChange()"
            class="form-input"
            [class.error]="showError"
            placeholder="Enter passcode"
            autocomplete="off"
            required
          />
          
          <!-- Error message -->
          <div class="error-message" *ngIf="showError">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="error-icon">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            Incorrect passcode. Please try again.
          </div>
        </div>

        <button type="submit" class="submit-button" [disabled]="!passcode">
          <span class="button-text">Access Portal</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="button-icon">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Decorative elements -->
      <div class="decorative-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>
</div>
