<main class="app-shell">
  <!-- Side Menu -->
  <aside 
    class="side-menu" 
    [class.collapsed]="isMenuCollapsed"
    (mouseenter)="onMenuMouseEnter()"
    (mouseleave)="onMenuMouseLeave()">
    
    <div class="menu-header">
      <div class="menu-toggle" (click)="toggleMenu()">
        <!-- SVG Icon for Menu -->
        <svg 
          class="menu-icon" 
          [class.hovered]="isMenuHovered"
          xmlns="http://www.w3.org/2000/svg" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </div>
      <div class="menu-title" *ngIf="!isMenuCollapsed">
        <h1 class="menu-title-text">Cashflow Portal</h1>
      </div>
    </div>

    <nav class="menu-content" *ngIf="!isMenuCollapsed">
      <ul class="menu-list">
        <li class="menu-item">
          <a routerLink="/category" class="menu-link">
            <span class="menu-text">Categories</span>
          </a>
        </li>
        <li class="menu-item">
          <a routerLink="/report" class="menu-link">
            <span class="menu-text">Reports</span>
          </a>
        </li>
        <!-- Add more menu items as needed -->
      </ul>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <div class="main-wrapper">
    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </div>
</main>
